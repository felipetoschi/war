name: 🐞 Bug
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Inicie uma partida com 3 jogadores
        2. Ataque de ... para ...
        3. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador e sistema
      placeholder: Chrome 130 no Windows 11
